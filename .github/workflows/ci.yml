name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Windows installer (main only)
        required: false
        default: false
        type: boolean

env:
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  portable-core:
    name: Linux core, CLI and GLib regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - run: python -B scripts/test_build_nsis_resilient.py
      - run: python -B scripts/test_linux_dsh_native_webview.py
      - run: python -B scripts/test_fetch_dsh_native_ui_archives.py
      - run: python -B scripts/test_linux_qoder_webview.py
      - run: python -B scripts/test_linux_qoder_deploy_webview.py
      - run: python -B scripts/test_linux_qwen_webview.py
      - run: python -B scripts/test_linux_codex_config_webview.py
      - run: python -B scripts/test_windows_codex_ui_acceptance.py
      - run: python -B scripts/test_qoder_complete_fixtures.py
      - name: Qwen reviewed release verifier offline regressions
        run: python -B scripts/test_qwen_release_evidence.py
      - name: Qwen official 0.27.0 and 0.27.2 static configuration evidence (no execution)
        timeout-minutes: 5
        run: python -B scripts/verify_qwen_release_evidence.py --download --report "$RUNNER_TEMP/qwen-release-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Qwen-static-release-evidence-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/qwen-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve DSH evidence bytes across Git checkout modes
        run: python -B scripts/test_dsh_evidence_checkout.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p aisync-core -p aisync-cli --all-targets -- -D warnings
      - run: python scripts/run-isolated.py cargo test --locked -p aisync-core -p aisync-cli
      - name: DSH pinned root archive downloader (offline safety regressions)
        run: python -B scripts/test_dsh_distribution_smoke.py
      - name: DSH subprocess archive offline safety regressions
        run: python -B scripts/test_dsh_subprocess_smoke.py
      - name: DSH native archives offline safety regressions
        run: python -B scripts/test_dsh_native_smoke.py
      - name: Build real DSH inspection CLI
        run: cargo build --locked -p aisync-cli
      - name: Verify official DSH root archive without installation or execution
        timeout-minutes: 5
        run: python -B scripts/dsh_distribution_smoke.py --cli "$PWD/target/debug/aisync" --destination "$RUNNER_TEMP/dsh-root-package-smoke"
      - name: Install official exec tracer for DSH static acceptance
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace
          test -x /usr/bin/strace
      - name: Verify reachable DSH subprocess archive without lifecycle execution
        timeout-minutes: 5
        run: python -B scripts/dsh_subprocess_smoke.py --cli "$PWD/target/debug/aisync" --destination "$RUNNER_TEMP/dsh-subprocess-package-smoke" | tee "$RUNNER_TEMP/dsh-subprocess-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSH-subprocess-verification-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/dsh-subprocess-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify four official DSH native archives without loading native code
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/dsh_native_smoke.py --cli "$PWD/target/debug/aisync" --destination "$RUNNER_TEMP/dsh-native-package-smoke" | tee "$RUNNER_TEMP/dsh-native-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSH-native-verification-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/dsh-native-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Codex animations Linux filesystem metadata guards
        run: python scripts/run-isolated.py cargo test --locked -p aisync-core --test codex_animations_fs_metadata -- --ignored
      - name: Qwen owned setting rejects extended POSIX ACLs
        run: python scripts/run-isolated.py cargo test --locked -p aisync-core extended_posix_acl_is_not_silently_lost -- --ignored
      - name: Qwen owned setting refuses unpreserved Linux extended attributes
        run: python scripts/run-isolated.py cargo test --locked -p aisync-core extended_attributes_ -- --ignored
      - run: python scripts/run-isolated.py cargo run --locked -p aisync-cli -- health
      - run: python scripts/run-isolated.py cargo run --locked -p aisync-cli -- agents
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trusted Node inherited preload protection (real Node, authored fixture)
        run: AGENTDECK_TEST_NODE="$(command -v node)" python scripts/run-isolated.py cargo test --locked -p aisync-core trusted_node_preload_environment_smoke --lib -- --ignored --nocapture
      - name: Reviewed install synthetic fixture contract (offline)
        run: python -B scripts/test_linux_install_webview.py
      - name: Official Codex installation harness (offline safety regressions)
        run: python -B scripts/test_codex_official_install.py
      - name: Windows reviewed install fixture (offline safety regressions)
        run: python -B scripts/test_windows_install_fixture.py
      - name: Windows reviewed install UI wiring (offline)
        run: python -B scripts/test_windows_install_ui_acceptance.py
      - name: Windows official Codex installation harness (offline safety regressions)
        run: python -B scripts/test_codex_official_install_windows.py
      - name: Install pinned official Codex package layout (never execute agent)
        timeout-minutes: 10
        run: |
          mkdir -m 700 "$RUNNER_TEMP/codex-install-evidence"
          python -B scripts/codex_official_install.py --node "$(command -v node)" --npm "$(command -v npm)" --evidence "$RUNNER_TEMP/codex-install-evidence/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Codex-install-layout-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/codex-install-evidence/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Qoder pinned archive downloader (offline safety regressions)
        run: python -B scripts/test_fetch_qoder_ui_archive.py
      - name: Qwen distribution harness (offline safety regressions)
        run: python scripts/test_qwen_distribution_harness.py
      - name: Qwen owned field compatibility (synthetic, pinned offline source)
        run: python scripts/run-isolated.py node scripts/test-qwen-owned-setting.mjs
      - name: Install official runner GLib development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-dev pkg-config
          dpkg-query -W libglib2.0-dev pkg-config
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0
          rustc --version --verbose
      - run: cargo clippy --locked -p glib-regression --all-targets -- -D warnings
      - name: GLib string iterator regressions (debug, opt-level 2, release)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_PROFILE_TEST_OPT_LEVEL=0 python scripts/run-isolated.py cargo test --locked -p glib-regression --lib
          CARGO_PROFILE_TEST_OPT_LEVEL=2 python scripts/run-isolated.py cargo test --locked -p glib-regression --lib
          CARGO_PROFILE_RELEASE_OPT_LEVEL=3 python scripts/run-isolated.py cargo test --locked -p glib-regression --lib --release

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify exact GLib source backport and locked Linux graph
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://static.crates.io/crates/glib/glib-0.18.5.crate \
            --output "$RUNNER_TEMP/glib-0.18.5.crate"
          GLIB_BACKPORT_ARCHIVE="$RUNNER_TEMP/glib-0.18.5.crate" python -B scripts/test_verify_glib_backport.py
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > glib-metadata.json
          python scripts/verify-glib-backport.py \
            --archive "$RUNNER_TEMP/glib-0.18.5.crate" --metadata glib-metadata.json \
            --audit-lock-output glib-registry-origin.lock > glib-backport-verification.json
      # cargo-audit skips path dependencies. Retain the original advisory in a
      # conservative registry-origin view instead of hiding it after vendoring.
      - run: cargo audit --file glib-registry-origin.lock --json > cargo-audit.json
      - name: Record source, graph and advisory evidence together
        run: |
          python scripts/verify-glib-backport.py \
            --archive "$RUNNER_TEMP/glib-0.18.5.crate" --metadata glib-metadata.json \
            --audit-json cargo-audit.json > glib-backport-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ env.BUILD_SHA }}
          path: |
            cargo-audit.json
            glib-metadata.json
            glib-backport-verification.json
            glib-registry-origin.lock
          if-no-files-found: warn

  windows:
    name: Windows native tests and installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Preserve DSH evidence bytes across Git checkout modes
        run: python -B scripts/test_dsh_evidence_checkout.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows official Codex installation harness (offline safety regressions)
        run: python -B scripts/test_codex_official_install_windows.py
      - name: Build production selected-prefix static parser
        run: cargo build --locked -p aisync-cli
      - name: Install pinned official Windows Codex package layout (never execute agent)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $npm = Join-Path (Split-Path -Parent $node) 'node_modules/npm/bin/npm-cli.js'
          if (-not (Test-Path -LiteralPath $npm -PathType Leaf)) { throw 'Official npm CLI missing beside trusted Node' }
          $evidence = Join-Path $env:RUNNER_TEMP 'codex-windows-install-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          # Cargo may hardlink the top-level executable to deps. Copy reviewed
          # build bytes into a new file; retain the verifier's no-hardlink policy.
          $builtParser = Join-Path $PWD 'target/debug/aisync.exe'
          $verifierDirectory = Join-Path $env:RUNNER_TEMP 'codex-static-verifier'
          New-Item -ItemType Directory -Path $verifierDirectory | Out-Null
          $parser = Join-Path $verifierDirectory 'aisync.exe'
          $source = Get-Item -LiteralPath $builtParser
          if ($source.PSIsContainer -or ($source.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $source.Length -lt 2 -or $source.Length -gt 402653184) { throw 'Trusted parser build metadata invalid' }
          $sourceHash = (Get-FileHash -LiteralPath $builtParser -Algorithm SHA256).Hash
          [IO.File]::Copy($builtParser, $parser, $false)
          if ((Get-Item -LiteralPath $parser).Length -ne $source.Length -or (Get-FileHash -LiteralPath $parser -Algorithm SHA256).Hash -cne $sourceHash -or (Get-FileHash -LiteralPath $builtParser -Algorithm SHA256).Hash -cne $sourceHash) { throw 'Trusted parser copy mismatch' }
          python -B scripts/codex_official_install_windows.py --node $node --npm $npm --parser $parser --evidence (Join-Path $evidence 'result.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Codex-Windows-install-layout-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/codex-windows-install-evidence/result.json
          if-no-files-found: error
          retention-days: 14
      - run: npm ci --prefix web/ui
      - run: npm run build --prefix web/ui
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python scripts/run-isolated.py cargo test --locked --workspace
      - name: Trusted Node inherited preload protection (real Node, authored fixture)
        shell: pwsh
        run: |
          $env:AGENTDECK_TEST_NODE = (Get-Command node).Source
          python scripts/run-isolated.py cargo test --locked -p aisync-core trusted_node_preload_environment_smoke --lib -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/run-isolated.py cargo run --locked -p aisync-cli -- health
      - name: Qwen owned field compatibility (synthetic, pinned offline source)
        run: python scripts/run-isolated.py node scripts/test-qwen-owned-setting.mjs
      - name: Test bounded NSIS build retry classifier (offline)
        run: python -B scripts/test_build_nsis_resilient.py
      - name: Build NSIS installer (bounded official download retry)
        timeout-minutes: 15
        run: python -B scripts/build_nsis_resilient.py
      - name: Record installer integrity
        shell: pwsh
        run: |
          $installers = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if ($installers.Count -lt 1) { throw "NSIS installer missing" }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.DirectoryName)/SHA256SUMS.txt" -Append -Encoding ascii
          }
          "${{ env.BUILD_SHA }}" | Out-File target/release/bundle/nsis/BUILD_COMMIT.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-windows-${{ env.BUILD_SHA }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 30

  windows-acceptance:
    name: Windows installed application lifecycle
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Windows reviewed install fixture (offline safety regressions)
        run: python -B scripts/test_windows_install_fixture.py
      - name: Windows reviewed install UI wiring (offline)
        run: python -B scripts/test_windows_install_ui_acceptance.py
      - uses: actions/download-artifact@v4
        with:
          name: AgentDeck-windows-${{ env.BUILD_SHA }}
          path: acceptance/current
      - name: Download fixed published upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.1 --repo MOSHOULI/agentdeck --dir acceptance/baseline --pattern 'AgentDeck_1.1.1_x64-setup.exe' --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Published baseline download failed' }
      - name: Test pinned Qoder download helper (offline)
        run: python -B scripts/test_fetch_qoder_ui_archive.py
      - name: Fetch pinned Qoder archive for read-only UI verification
        shell: pwsh
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory -Force -Path acceptance/evidence | Out-Null
          $report = & python -B scripts/fetch_qoder_ui_archive.py --destination (Join-Path $env:RUNNER_TEMP 'qoder-real-ui')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Qoder archive unavailable or invalid; acceptance cannot be skipped' }
          $report | Set-Content -LiteralPath acceptance/evidence/qoder-download.json -Encoding utf8
      - name: Execute Windows fixture UTF8 transport regression
        shell: pwsh
        run: ./scripts/test_windows_install_transport.ps1
      - name: Real Windows failed-install residual snapshot regressions
        shell: pwsh
        run: ./scripts/test_windows_failed_install_state.ps1
      - name: Execute Windows workspace activation route regressions
        shell: pwsh
        run: ./scripts/test_windows_workspace_activation.ps1
      - name: Execute Windows evidence canary guard regressions
        shell: pwsh
        run: ./scripts/test_windows_acceptance_canaries.ps1
      - name: Parse Windows installed UI acceptance scripts
        shell: pwsh
        run: |
          foreach ($file in @('windows-installer-acceptance.ps1', 'windows-codex-ui-acceptance.ps1', 'windows-install-ui-acceptance.ps1')) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/$file"), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Acceptance script syntax invalid: $file" }
          }
      - name: Verify artifacts and exercise installed application
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $current = "AgentDeck_$($version)_x64-setup.exe"
          if ((Get-Content acceptance/current/BUILD_COMMIT.txt -Raw).Trim() -ne $env:BUILD_SHA) { throw 'Artifact build commit mismatch' }
          foreach ($pair in @(@('acceptance/current', $current), @('acceptance/baseline', 'AgentDeck_1.1.1_x64-setup.exe'))) {
            $lines = @(Get-Content "$($pair[0])/SHA256SUMS.txt" | Where-Object { $_ -match ('^[a-fA-F0-9]{64}  ' + [regex]::Escape($pair[1]) + '$') })
            if ($lines.Count -ne 1) { throw 'Missing or ambiguous installer checksum' }
            $actual = (Get-FileHash "$($pair[0])/$($pair[1])" -Algorithm SHA256).Hash
            if ($actual -ne $lines[0].Substring(0, 64)) { throw 'Installer checksum mismatch' }
          }
          if ((Get-FileHash acceptance/baseline/AgentDeck_1.1.1_x64-setup.exe -Algorithm SHA256).Hash -ne '78be70c5788ca41f118dbabc99b3dcae5fddd37a53c70eef46ef31ab3efe8e2d') { throw 'Published baseline differs from reviewed pinned hash' }
          ./scripts/windows-installer-acceptance.ps1 -Installer "acceptance/current/$current" -BaselineInstaller acceptance/baseline/AgentDeck_1.1.1_x64-setup.exe -ExpectedVersion $version -ExpectedCommit $env:BUILD_SHA -EvidenceDirectory acceptance/evidence -RealQoderArchive (Join-Path $env:RUNNER_TEMP 'qoder-real-ui/qodercli-linux-x64-baseline.tar.gz')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-acceptance-${{ env.BUILD_SHA }}
          path: acceptance/evidence/
          if-no-files-found: warn
          retention-days: 14

  linux-webview:
    name: Linux real WebView cache and reviewed install acceptance (${{ matrix.qoder_release }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        qoder_release: ['1.1.85', '1.1.86']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install official Linux WebView and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth dbus-x11 strace
          test -x /usr/bin/WebKitWebDriver
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
          dpkg-query -W webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev
      - name: Install pinned external Tauri driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Offline acceptance harness and complete-fixture checks
        run: |
          python -B scripts/test_linux_dsh_native_webview.py
          python -B scripts/test_fetch_dsh_native_ui_archives.py
          python -B scripts/test_linux_qoder_webview.py
          python -B scripts/test_linux_qoder_deploy_webview.py
          python -B scripts/test_linux_qwen_webview.py
          python -B scripts/test_linux_codex_config_webview.py
          python -B scripts/test_linux_install_webview.py
          python -B scripts/test_qoder_complete_fixtures.py
          python -B scripts/test_qoder_private_deploy_acceptance.py
          python -B scripts/test_fetch_qoder_ui_archive.py
          python -B scripts/test_qoder_releases.py
          python -B scripts/test_qoder_cross_release_acceptance.py
          python -B scripts/test_dsh_distribution_smoke.py
      - name: Fetch pinned official Qoder archive (never execute)
        timeout-minutes: 4
        run: python -B scripts/fetch_qoder_ui_archive.py --release "${{ matrix.qoder_release }}" --destination "$RUNNER_TEMP/qoder-linux-official"
      - name: Fetch pinned official DSH root archive (no CLI or package execution)
        timeout-minutes: 5
        run: python -B scripts/fetch_dsh_ui_archive.py --destination "$RUNNER_TEMP/dsh-linux-official"
      - name: Prepare fixed DSH native archives (no execution)
        timeout-minutes: 5
        run: python -B scripts/fetch_dsh_native_ui_archives.py --destination "$RUNNER_TEMP/dsh-native-linux-official"
      - name: Build exact checkout CLI for controlled cache preparation
        run: cargo build --locked -p aisync-cli
      - name: Fixed Qoder private deployment CLI acceptance (never run Qoder)
        timeout-minutes: 8
        run: |
          python -B scripts/qoder_private_deploy_acceptance.py --release "${{ matrix.qoder_release }}" \
            --cli "$PWD/target/debug/aisync" \
            --archive "$RUNNER_TEMP/qoder-linux-official/qodercli-linux-x64-baseline.tar.gz" \
            --evidence "$RUNNER_TEMP/qoder-private-deploy-evidence"
      - name: Fetch legacy archive for cross-release rejection (never execute)
        if: matrix.qoder_release == '1.1.86'
        timeout-minutes: 4
        run: python -B scripts/fetch_qoder_ui_archive.py --release 1.1.85 --destination "$RUNNER_TEMP/qoder-linux-legacy"
      - name: Real mixed-version receipt archive and payload rejection
        if: matrix.qoder_release == '1.1.86'
        timeout-minutes: 12
        run: |
          python -B scripts/qoder_cross_release_acceptance.py \
            --cli "$PWD/target/debug/aisync" \
            --legacy-archive "$RUNNER_TEMP/qoder-linux-legacy/qodercli-linux-x64-baseline.tar.gz" \
            --current-archive "$RUNNER_TEMP/qoder-linux-official/qodercli-linux-x64-baseline.tar.gz" \
            --evidence "$RUNNER_TEMP/qoder-cross-release-evidence"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.qoder_release == '1.1.86'
        with:
          name: Qoder-cross-release-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/qoder-cross-release-evidence/result.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qoder-private-deploy-${{ matrix.qoder_release }}-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/qoder-private-deploy-evidence/result.json
          if-no-files-found: error
          retention-days: 14
      - run: npm ci --prefix web/ui
      - name: Build real native Linux application, without packaging or test plugins
        run: npm exec --prefix web/ui -- tauri build --debug --no-bundle --ci -- --locked
      - name: Native Linux Qoder IPC regression tests
        run: cargo test --locked -p agentdeck commands::qoder --lib
      - name: Native Linux Qwen checked restoration IPC regression tests
        run: cargo test --locked -p agentdeck commands::qwen --lib
      - name: Native Linux DSH root package IPC regression tests
        run: cargo test --locked -p agentdeck commands::dsh_distribution --lib
      - name: Real WebView click/type cache observation and confirmed writes (sandbox retained)
        timeout-minutes: 15
        run: |
          dbus-run-session -- xvfb-run -a python -B scripts/linux_qoder_webview.py --release "${{ matrix.qoder_release }}" \
            --application "$PWD/target/debug/agentdeck" \
            --driver "$HOME/.cargo/bin/tauri-driver" \
            --native-driver /usr/bin/WebKitWebDriver \
            --evidence "$RUNNER_TEMP/linux-webview-evidence" \
            --cli "$PWD/target/debug/aisync" \
            --archive "$RUNNER_TEMP/qoder-linux-official/qodercli-linux-x64-baseline.tar.gz" \
            --dsh-archive "$RUNNER_TEMP/dsh-linux-official/dsh-0.2.2-rc.1.tgz" \
            --dsh-native-source "$RUNNER_TEMP/dsh-native-linux-official"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-webview-${{ matrix.qoder_release }}-${{ env.BUILD_SHA }}
          path: ${{ runner.temp }}/linux-webview-evidence/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish verified Windows installer
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    needs: [frontend, portable-core, dependency-audit, windows, windows-acceptance, linux-webview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: AgentDeck-windows-${{ github.sha }}
          path: installer
      - name: Verify provenance and checksums
        working-directory: installer
        run: |
          test "$(tr -d '\r\n' < BUILD_COMMIT.txt)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS.txt
      - name: Stage, verify and publish new version (never overwrite a release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          installer_name="AgentDeck_${version}_x64-setup.exe"
          test -f "installer/$installer_name"
          test "$(find installer -type f | wc -l)" -eq 3
          expected_checksums=$(cd installer && sha256sum "$installer_name")
          test "$(tr -d '\r' < installer/SHA256SUMS.txt)" = "$expected_checksums"

          # Listing must succeed; an API/network error is not evidence of absence.
          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$existing_tags"; then
            echo "::error::Release $tag already exists. Preserve it and verify it manually; this workflow never overwrites or silently accepts existing releases."
            exit 1
          fi

          tag_commit() {
            git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" |
              awk -v ref="refs/tags/$tag" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : tag }'
          }
          remote_commit=$(tag_commit)
          if [ -z "$remote_commit" ]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          elif [ "$remote_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag points to $remote_commit, not $GITHUB_SHA. Refusing to publish."
            exit 1
          fi
          remote_commit=$(tag_commit)
          test "$remote_commit" = "$GITHUB_SHA"

          # Keep assets private until their uploaded bytes and source tag are verified.
          gh release create "$tag" "installer/$installer_name" installer/SHA256SUMS.txt installer/BUILD_COMMIT.txt \
            --verify-tag --target "$GITHUB_SHA" --title "AgentDeck v$version" --notes-file "docs/RELEASE-$version.md" --draft --latest=false
          is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          test "$is_draft" = true
          gh release download "$tag" --dir verified \
            --pattern "$installer_name" --pattern SHA256SUMS.txt --pattern BUILD_COMMIT.txt
          for file in "$installer_name" SHA256SUMS.txt BUILD_COMMIT.txt; do
            cmp "installer/$file" "verified/$file"
          done
          test "$(tr -d '\r\n' < verified/BUILD_COMMIT.txt)" = "$GITHUB_SHA"
          (cd verified && sha256sum --check --strict SHA256SUMS.txt)
          remote_commit=$(tag_commit)
          test "$remote_commit" = "$GITHUB_SHA"

          # Latest remains the signed registry feed; this is an installer-only release.
          gh release edit "$tag" --draft=false --latest=false
          is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          test "$is_draft" = false
          remote_commit=$(tag_commit)
          test "$remote_commit" = "$GITHUB_SHA"
