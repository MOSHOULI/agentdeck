[package]
name = "aisync-core"
version = "1.2.0"
edition = "2024"
description = "AgentDeck 核心引擎——Agent 部署、记忆管理、密钥加密、配置同步"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
zeroize = "1"
ring = "0.17"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.20"
# Maintained YAML implementation; alias preserves existing serialization call sites.
serde_yml = { package = "serde_norway", version = "0.9.42" }
dirs = "6"
walkdir = "2"
regex = "1"
base64 = "0.22"
ureq = "2"
# Pure in-memory DSH archive decoding is compiled on all targets. Actual file
# access still fails closed outside the audited selected-reader platforms.
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"
tar = { version = "0.4", default-features = false }
