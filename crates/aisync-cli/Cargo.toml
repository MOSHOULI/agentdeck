[package]
name = "aisync-cli"
version = "1.1.0"
edition = "2024"
description = "AgentDeck CLI——命令行工具"

[[bin]]
name = "aisync"
path = "src/main.rs"

[dependencies]
aisync-core = { path = "../aisync-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
chrono = "0.4"
